<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Fredoka, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif">
  <title>Chispa – batería y secuenciador de 16 pasos</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
  <!-- rejilla: fondo de celdas -->
  <g>
    <!-- generamos 7 filas x 16 columnas a mano: x = 180 + i*45, y = 116 + r*50 -->
    <g id="row" fill="#2a1d48">
      <rect x="180" width="38" height="38" rx="9"/><rect x="225" width="38" height="38" rx="9"/><rect x="270" width="38" height="38" rx="9"/><rect x="315" width="38" height="38" rx="9"/>
      <rect x="364" width="38" height="38" rx="9"/><rect x="409" width="38" height="38" rx="9"/><rect x="454" width="38" height="38" rx="9"/><rect x="499" width="38" height="38" rx="9"/>
      <rect x="548" width="38" height="38" rx="9"/><rect x="593" width="38" height="38" rx="9"/><rect x="638" width="38" height="38" rx="9"/><rect x="683" width="38" height="38" rx="9"/>
      <rect x="732" width="38" height="38" rx="9"/><rect x="777" width="38" height="38" rx="9"/><rect x="822" width="38" height="38" rx="9"/><rect x="867" width="38" height="38" rx="9"/>
    </g>
  </g>
  </defs>
  <rect width="960" height="540" fill="#FF7A1A"/>
  <rect x="12" y="12" width="936" height="516" rx="36" fill="url(#body)"/>

  <rect x="36" y="30" width="270" height="48" rx="24" fill="#FF3B30"/>
  <text x="171" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">🥁 BATERÍA</text>
  <rect x="320" y="30" width="230" height="48" rx="24" fill="#fff"/>
  <text x="435" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7A1A">Kit: Cocina · 100</text>
  <text x="924" y="62" text-anchor="end" font-size="18" font-weight="700" fill="#5A3A00">A–J tocar · ←→ paso · Espacio poner</text>

  <rect x="36" y="96" width="888" height="414" rx="26" fill="#1C1230" stroke="#FF7A1A" stroke-width="8"/>

  <!-- filas: 7 sonidos x 16 pasos -->
  <g font-weight="700" font-size="16">
    <!-- nombres -->
    <g fill="#fff" text-anchor="end">
      <text x="166" y="140" fill="#FF3B3B">[A] Bombo</text>
      <text x="166" y="190" fill="#FF8A00">[S] Caja</text>
      <text x="166" y="240" fill="#FFD400">[D] Charles</text>
      <text x="166" y="290" fill="#2ED573">[F] Palmas</text>
      <text x="166" y="340" fill="#1EC8FF">[G] Cacerola</text>
      <text x="166" y="390" fill="#3D7BFF">[H] Cuchara</text>
      <text x="166" y="440" fill="#B45CFF">[J] Ladrido</text>
    </g>
  </g>
  <use href="#row" y="116"/><use href="#row" y="166"/><use href="#row" y="216"/><use href="#row" y="266"/>
  <use href="#row" y="316"/><use href="#row" y="366"/><use href="#row" y="416"/>

  <!-- notas activas -->
  <g>
    <g fill="#FF3B3B"><rect x="180" y="116" width="38" height="38" rx="9"/><rect x="364" y="116" width="38" height="38" rx="9"/><rect x="548" y="116" width="38" height="38" rx="9"/><rect x="638" y="116" width="38" height="38" rx="9"/><rect x="732" y="116" width="38" height="38" rx="9"/></g>
    <g fill="#FF8A00"><rect x="270" y="166" width="38" height="38" rx="9"/><rect x="454" y="166" width="38" height="38" rx="9"/><rect x="638" y="166" width="38" height="38" rx="9"/><rect x="822" y="166" width="38" height="38" rx="9"/></g>
    <g fill="#FFD400"><rect x="180" y="216" width="38" height="38" rx="9"/><rect x="225" y="216" width="38" height="38" rx="9"/><rect x="270" y="216" width="38" height="38" rx="9"/><rect x="315" y="216" width="38" height="38" rx="9"/><rect x="364" y="216" width="38" height="38" rx="9"/><rect x="409" y="216" width="38" height="38" rx="9"/><rect x="454" y="216" width="38" height="38" rx="9"/><rect x="499" y="216" width="38" height="38" rx="9"/><rect x="548" y="216" width="38" height="38" rx="9"/><rect x="593" y="216" width="38" height="38" rx="9"/><rect x="638" y="216" width="38" height="38" rx="9"/><rect x="683" y="216" width="38" height="38" rx="9"/><rect x="732" y="216" width="38" height="38" rx="9"/><rect x="777" y="216" width="38" height="38" rx="9"/><rect x="822" y="216" width="38" height="38" rx="9"/><rect x="867" y="216" width="38" height="38" rx="9"/></g>
    <g fill="#2ED573"><rect x="270" y="266" width="38" height="38" rx="9"/><rect x="638" y="266" width="38" height="38" rx="9"/></g>
    <g fill="#1EC8FF"><rect x="499" y="316" width="38" height="38" rx="9"/><rect x="867" y="316" width="38" height="38" rx="9"/></g>
    <g fill="#3D7BFF"><rect x="315" y="366" width="38" height="38" rx="9"/><rect x="683" y="366" width="38" height="38" rx="9"/></g>
    <g fill="#B45CFF"><rect x="822" y="416" width="38" height="38" rx="9"/></g>
  </g>

  <!-- columna actual (cabezal) -->
  <rect x="451" y="108" width="44" height="354" rx="12" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- cursor de edición -->
  <rect x="590" y="363" width="44" height="44" rx="12" fill="none" stroke="#FFE45C" stroke-width="4" stroke-dasharray="6 5"/>

  <!-- números de paso -->
  <g font-size="13" font-weight="700" fill="#8a7bb0" text-anchor="middle">
    <text x="199" y="486">1</text><text x="383" y="486">5</text><text x="567" y="486">9</text><text x="751" y="486">13</text>
  </g>
</svg>
