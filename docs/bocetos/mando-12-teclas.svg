<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Fredoka, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif">
  <title>Chispa – mapa del mando de 12 teclas y 4 perillas</title>
  <rect width="960" height="600" rx="30" fill="#FFC21A"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#5A3A00">El mando: 12 teclas + 4 perillas</text>
  <text x="40" y="82" font-size="16" font-weight="700" fill="#8a5a00">(distribución supuesta 3×4 — se ajusta cuando llegue)</text>

  <!-- cuerpo del mando -->
  <rect x="40" y="104" width="470" height="470" rx="34" fill="#1C1230" stroke="#FF7A1A" stroke-width="8"/>

  <!-- perillas -->
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(103,170)">
      <circle r="40" fill="#3d2c66"/><circle r="30" fill="#c9c4d6"/><rect x="-3" y="-28" width="6" height="16" rx="3" fill="#1C1230"/>
      <text y="62" font-size="15" fill="#fff">P1 Volumen</text>
    </g>
    <g transform="translate(218,170)">
      <circle r="40" fill="#FF7A1A" opacity="0.5"/><circle r="30" fill="#FF7A1A"/><rect x="-3" y="-28" width="6" height="16" rx="3" fill="#fff"/>
      <text y="62" font-size="15" fill="#FFE45C">P2 Mágica</text>
    </g>
    <g transform="translate(333,170)">
      <circle r="40" fill="#3d2c66"/><circle r="30" fill="#c9c4d6"/><rect x="-3" y="-28" width="6" height="16" rx="3" fill="#1C1230"/>
      <text y="62" font-size="15" fill="#fff">P3 Tempo</text>
    </g>
    <g transform="translate(448,170)">
      <circle r="40" fill="#3d2c66"/><circle r="30" fill="#c9c4d6"/><rect x="-3" y="-28" width="6" height="16" rx="3" fill="#1C1230"/>
      <text y="62" font-size="15" fill="#fff">P4 Efecto</text>
    </g>
  </g>

  <!-- teclas 3x4 -->
  <g font-weight="700" text-anchor="middle">
    <!-- fila 1 -->
    <g transform="translate(60,262)"><rect width="96" height="90" rx="18" fill="#FF3B3B"/><text x="48" y="50" font-size="34" fill="#fff">I</text><text x="48" y="76" font-size="14" fill="#fff">Do</text></g>
    <g transform="translate(173,262)"><rect width="96" height="90" rx="18" fill="#FF8A00"/><text x="48" y="50" font-size="34" fill="#fff">ii</text><text x="48" y="76" font-size="14" fill="#fff">Rem</text></g>
    <g transform="translate(286,262)"><rect width="96" height="90" rx="18" fill="#FFD400"/><text x="48" y="50" font-size="34" fill="#5A3A00">iii</text><text x="48" y="76" font-size="14" fill="#5A3A00">Mim</text></g>
    <g transform="translate(399,262)"><rect width="96" height="90" rx="18" fill="#2ED573"/><text x="48" y="50" font-size="34" fill="#fff">IV</text><text x="48" y="76" font-size="14" fill="#fff">Fa</text></g>
    <!-- fila 2 -->
    <g transform="translate(60,366)"><rect width="96" height="90" rx="18" fill="#1EC8FF"/><text x="48" y="50" font-size="34" fill="#fff">V</text><text x="48" y="76" font-size="14" fill="#fff">Sol</text></g>
    <g transform="translate(173,366)"><rect width="96" height="90" rx="18" fill="#3D7BFF"/><text x="48" y="50" font-size="34" fill="#fff">vi</text><text x="48" y="76" font-size="14" fill="#fff">Lam</text></g>
    <g transform="translate(286,366)"><rect width="96" height="90" rx="18" fill="#B45CFF"/><text x="48" y="50" font-size="34" fill="#fff">vii</text><text x="48" y="76" font-size="14" fill="#fff">Si°</text></g>
    <g transform="translate(399,366)"><rect width="96" height="90" rx="18" fill="#fff"/><circle cx="48" cy="38" r="18" fill="#FF3B30"/><text x="48" y="78" font-size="14" fill="#5A3A00">Grabar</text></g>
    <!-- fila 3 -->
    <g transform="translate(60,470)"><rect width="96" height="90" rx="45" fill="#8E8A99"/><text x="48" y="54" font-size="20" fill="#fff">Tono</text></g>
    <g transform="translate(173,470)"><rect width="96" height="90" rx="45" fill="#FFE600"/><text x="48" y="54" font-size="20" fill="#5A3A00">Sonido</text></g>
    <g transform="translate(286,470)"><rect width="96" height="90" rx="45" fill="#FF3B30"/><text x="48" y="54" font-size="20" fill="#fff">Modo</text></g>
    <g transform="translate(399,470)"><rect width="96" height="90" rx="18" fill="#fff"/><path d="M36 22 L66 42 L36 62 Z" fill="#2ED573"/><text x="48" y="80" font-size="14" fill="#5A3A00">Play</text></g>
  </g>

  <!-- leyenda de perillas -->
  <g font-weight="700" fill="#5A3A00">
    <text x="540" y="128" font-size="22">Perillas (girar · pulsar)</text>
    <g font-size="15">
      <rect x="540" y="142" width="384" height="78" rx="16" fill="#fff"/>
      <text x="556" y="166" font-size="17">P1 · Volumen</text>
      <text x="556" y="188">+Tono: attack · +Sonido: release</text>
      <text x="556" y="208">pulsar: silencio</text>

      <rect x="540" y="230" width="384" height="118" rx="16" fill="#FF7A1A"/>
      <text x="556" y="254" font-size="17" fill="#fff">P2 · Mágica (el joystick)</text>
      <text x="556" y="276" fill="#fff">con acorde pulsado: cambia su color</text>
      <text x="556" y="296" fill="#fff">+Tono: tonalidad · +Sonido: sonido</text>
      <text x="556" y="316" fill="#fff">+Modo: modo · pulsar: fijar acorde</text>
      <text x="556" y="336" fill="#fff">menú + pulsar: aleatorio</text>

      <rect x="540" y="358" width="384" height="78" rx="16" fill="#fff"/>
      <text x="556" y="382" font-size="17">P3 · Tempo (40–300)</text>
      <text x="556" y="404">+Tono: octava · +Modo: patrón</text>
      <text x="556" y="424">pulsar: tap tempo</text>

      <rect x="540" y="446" width="384" height="78" rx="16" fill="#fff"/>
      <text x="556" y="470" font-size="17">P4 · Efecto</text>
      <text x="556" y="492">filtro · +Sonido: cantidad · +Modo: swing</text>
      <text x="556" y="512">pulsar: efectos on/off</text>
    </g>
  </g>

  <!-- rueda de colores de P2 -->
  <g transform="translate(540,548)" font-weight="700" font-size="13">
    <text x="0" y="0" fill="#5A3A00">P2 con acorde:</text>
    <text x="0" y="22" fill="#8a5a00">normal › may/men › 7ª › dom7 › 9ª › sus4 › dim › aum</text>
  </g>
</svg>
