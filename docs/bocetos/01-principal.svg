<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Fredoka, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif">
  <title>Chispa – pantalla principal (modo Tocar)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- carcasa -->
  <rect width="960" height="540" fill="#FF7A1A"/>
  <rect x="12" y="12" width="936" height="516" rx="36" fill="url(#body)"/>

  <!-- barra superior -->
  <g font-size="20" font-weight="700">
    <rect x="36" y="30" width="150" height="40" rx="20" fill="#FF3B30"/>
    <text x="111" y="57" text-anchor="middle" fill="#fff">▶ TOCAR</text>
    <rect x="196" y="30" width="170" height="40" rx="20" fill="#8E8A99"/>
    <text x="281" y="57" text-anchor="middle" fill="#fff">Do mayor · oct 0</text>
    <rect x="376" y="30" width="190" height="40" rx="20" fill="#FFE600" stroke="#E0A800" stroke-width="3"/>
    <text x="471" y="57" text-anchor="middle" fill="#5A3A00">♪ Piano eléctrico</text>
    <rect x="576" y="30" width="130" height="40" rx="20" fill="#fff"/>
    <text x="641" y="57" text-anchor="middle" fill="#FF7A1A">♩ 120 BPM</text>
    <!-- vúmetro / volumen -->
    <g transform="translate(724,36)">
      <rect width="200" height="28" rx="14" fill="#5A3A00" opacity="0.2"/>
      <rect x="4" y="4" width="20" height="20" rx="6" fill="#2ED573"/>
      <rect x="28" y="4" width="20" height="20" rx="6" fill="#2ED573"/>
      <rect x="52" y="4" width="20" height="20" rx="6" fill="#2ED573"/>
      <rect x="76" y="4" width="20" height="20" rx="6" fill="#FFD400"/>
      <rect x="100" y="4" width="20" height="20" rx="6" fill="#FF8A00"/>
      <rect x="124" y="4" width="20" height="20" rx="6" fill="#fff" opacity="0.5"/>
      <rect x="148" y="4" width="20" height="20" rx="6" fill="#fff" opacity="0.5"/>
      <text x="186" y="21" text-anchor="middle" font-size="14" fill="#5A3A00">VOL</text>
    </g>
  </g>

  <!-- botones de menú (izquierda) -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="80" cy="140" r="36" fill="#8E8A99" stroke="#5f5b6b" stroke-width="5"/>
    <text x="80" y="135" fill="#fff" font-size="22">Z</text>
    <text x="80" y="156" fill="#fff">Tono</text>
    <circle cx="80" cy="230" r="36" fill="#FFE600" stroke="#D9A600" stroke-width="5"/>
    <text x="80" y="225" fill="#5A3A00" font-size="22">X</text>
    <text x="80" y="246" fill="#5A3A00">Sonido</text>
    <circle cx="80" cy="320" r="36" fill="#FF3B30" stroke="#B3221A" stroke-width="5"/>
    <text x="80" y="315" fill="#fff" font-size="22">C</text>
    <text x="80" y="336" fill="#fff">Modo</text>
  </g>

  <!-- pantalla OLED -->
  <rect x="150" y="90" width="560" height="270" rx="26" fill="#1C1230" stroke="#FF7A1A" stroke-width="8"/>
  <text x="430" y="200" text-anchor="middle" font-size="96" font-weight="700" fill="#FFE45C" filter="url(#glow)">Lam7</text>
  <text x="430" y="238" text-anchor="middle" font-size="22" fill="#4DF0FF">vi  ·  La – Do – Mi – Sol</text>
  <!-- osciloscopio -->
  <path d="M175 300 C 205 270, 225 270, 255 300 S 305 330, 335 300 S 385 270, 415 300 S 465 330, 495 300 S 545 270, 575 300 S 625 330, 655 300 S 685 285, 690 295"
        fill="none" stroke="#FF5CD6" stroke-width="4" filter="url(#glow)"/>
  <!-- mini piano -->
  <g transform="translate(250,322)">
    <g fill="#3a2d55">
      <rect x="0" width="22" height="26" rx="4"/><rect x="24" width="22" height="26" rx="4" fill="#FFE45C"/>
      <rect x="48" width="22" height="26" rx="4"/><rect x="72" width="22" height="26" rx="4" fill="#FFE45C"/>
      <rect x="96" width="22" height="26" rx="4"/><rect x="120" width="22" height="26" rx="4"/>
      <rect x="144" width="22" height="26" rx="4" fill="#FFE45C"/><rect x="168" width="22" height="26" rx="4"/>
      <rect x="192" width="22" height="26" rx="4" fill="#FFE45C"/><rect x="216" width="22" height="26" rx="4"/>
      <rect x="240" width="22" height="26" rx="4"/><rect x="264" width="22" height="26" rx="4"/>
    </g>
  </g>
  <!-- looper mini -->
  <g transform="translate(600,322)" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="0" cy="13" r="10" fill="#2ED573"/><text x="0" y="18" fill="#1C1230">1</text>
    <circle cx="24" cy="13" r="10" fill="#2ED573"/><text x="24" y="18" fill="#1C1230">2</text>
    <circle cx="48" cy="13" r="10" fill="#FF3B30"/><text x="48" y="18" fill="#fff">3</text>
    <circle cx="72" cy="13" r="10" fill="none" stroke="#5c4f7a" stroke-width="3"/>
    <circle cx="96" cy="13" r="10" fill="none" stroke="#5c4f7a" stroke-width="3"/>
  </g>

  <!-- joystick / flechas (derecha) -->
  <g transform="translate(830,215)" font-size="13" font-weight="700" text-anchor="middle" fill="#5A3A00">
    <circle r="92" fill="#FFF2B8" stroke="#FF7A1A" stroke-width="5"/>
    <circle r="26" fill="#FF7A1A"/>
    <text y="5" fill="#fff" font-size="12">flechas</text>
    <text y="-62">↑ may/men</text>
    <text x="0" y="74">↓ sus4</text>
    <text x="-58" y="5">← dim</text>
    <text x="66" y="5">7ª →</text>
    <text x="-46" y="-38" font-size="11">↖ aum</text>
    <text x="46" y="-38" font-size="11">dom7 ↗</text>
    <text x="46" y="50" font-size="11">9ª ↘</text>
    <!-- dirección activa -->
    <path d="M30 -10 L 46 0 L 30 10 Z" fill="#FF3B30"/><circle cx="66" cy="0" r="22" fill="#FF3B30" opacity="0.25"/>
  </g>
  <g font-size="14" font-weight="700" fill="#5A3A00" text-anchor="middle">
    <text x="830" y="335">Mantén un acorde</text>
    <text x="830" y="353">y pulsa una flecha</text>
  </g>

  <!-- botones de acorde -->
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(36,390)">
      <rect width="118" height="124" rx="26" fill="#FF3B3B" stroke="#B32222" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#fff">Do</text><text x="59" y="86" font-size="18" fill="#fff">I</text>
      <text x="59" y="112" font-size="18" fill="#fff" opacity="0.85">[A]</text>
    </g>
    <g transform="translate(166,390)">
      <rect width="118" height="124" rx="26" fill="#FF8A00" stroke="#B35F00" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#fff">Rem</text><text x="59" y="86" font-size="18" fill="#fff">ii</text>
      <text x="59" y="112" font-size="18" fill="#fff" opacity="0.85">[S]</text>
    </g>
    <g transform="translate(296,390)">
      <rect width="118" height="124" rx="26" fill="#FFD400" stroke="#B39400" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#5A3A00">Mim</text><text x="59" y="86" font-size="18" fill="#5A3A00">iii</text>
      <text x="59" y="112" font-size="18" fill="#5A3A00" opacity="0.85">[D]</text>
    </g>
    <g transform="translate(426,390)">
      <rect width="118" height="124" rx="26" fill="#2ED573" stroke="#1E9450" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#fff">Fa</text><text x="59" y="86" font-size="18" fill="#fff">IV</text>
      <text x="59" y="112" font-size="18" fill="#fff" opacity="0.85">[F]</text>
    </g>
    <g transform="translate(556,390)">
      <rect width="118" height="124" rx="26" fill="#1EC8FF" stroke="#0E8DB5" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#fff">Sol</text><text x="59" y="86" font-size="18" fill="#fff">V</text>
      <text x="59" y="112" font-size="18" fill="#fff" opacity="0.85">[G]</text>
    </g>
    <!-- acorde pulsado -->
    <g transform="translate(686,384)">
      <rect x="-6" y="-6" width="130" height="136" rx="30" fill="none" stroke="#fff" stroke-width="5"/>
      <rect y="10" width="118" height="124" rx="26" fill="#3D7BFF" stroke="#244FB3" stroke-width="5"/>
      <text x="59" y="68" font-size="38" fill="#fff">Lam</text><text x="59" y="96" font-size="18" fill="#fff">vi</text>
      <text x="59" y="122" font-size="18" fill="#fff" opacity="0.85">[H]</text>
    </g>
    <g transform="translate(816,390)">
      <rect width="118" height="124" rx="26" fill="#B45CFF" stroke="#7A35B3" stroke-width="5"/>
      <text x="59" y="58" font-size="38" fill="#fff">Si°</text><text x="59" y="86" font-size="18" fill="#fff">vii</text>
      <text x="59" y="112" font-size="18" fill="#fff" opacity="0.85">[J]</text>
    </g>
  </g>
</svg>
