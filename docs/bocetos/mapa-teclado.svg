<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Fredoka, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif">
  <title>Chispa – mapa del teclado y la perilla</title>
  <rect width="1200" height="520" rx="30" fill="#FFC21A"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#5A3A00">Mapa del teclado (como un HiChord)</text>

  <g font-weight="700" text-anchor="middle" font-size="22">
    <!-- fila F -->
    <g transform="translate(40,80)" font-size="16">
      <rect width="60" height="50" rx="10" fill="#fff" opacity="0.5"/><text x="30" y="31" fill="#5A3A00">Esc</text>
      <g transform="translate(90,0)"><rect width="60" height="50" rx="10" fill="#FFF2B8" stroke="#FF7A1A" stroke-width="3"/><text x="30" y="22" fill="#FF7A1A">F1</text><text x="30" y="40" font-size="12" fill="#5A3A00">P1</text></g>
      <g transform="translate(160,0)"><rect width="60" height="50" rx="10" fill="#FFF2B8" stroke="#FF7A1A" stroke-width="3"/><text x="30" y="22" fill="#FF7A1A">F2</text><text x="30" y="40" font-size="12" fill="#5A3A00">P2</text></g>
      <g transform="translate(230,0)"><rect width="60" height="50" rx="10" fill="#FFF2B8" stroke="#FF7A1A" stroke-width="3"/><text x="30" y="22" fill="#FF7A1A">F3</text><text x="30" y="40" font-size="12" fill="#5A3A00">P3</text></g>
      <g transform="translate(300,0)"><rect width="60" height="50" rx="10" fill="#FFF2B8" stroke="#FF7A1A" stroke-width="3"/><text x="30" y="22" fill="#FF7A1A">F4</text><text x="30" y="40" font-size="12" fill="#5A3A00">P4</text></g>
      <g transform="translate(390,0)"><rect width="90" height="50" rx="10" fill="#1EC8FF"/><text x="45" y="22" fill="#fff">F5</text><text x="45" y="40" font-size="12" fill="#fff">Canciones</text></g>
    </g>
    <!-- fila números: looper -->
    <g transform="translate(40,145)">
      <rect width="60" height="60" rx="12" fill="#fff" opacity="0.5"/>
      <g transform="translate(70,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#FF3B3B">1</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(140,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#FF8A00">2</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(210,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#FFD400">3</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(280,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#2ED573">4</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(350,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#1EC8FF">5</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(420,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="32" fill="#B45CFF">6</text><text x="30" y="50" font-size="11" fill="#fff">pista</text></g>
      <g transform="translate(700,0)"><rect width="120" height="60" rx="12" fill="#fff"/><text x="60" y="32" font-size="18" fill="#5A3A00">⌫</text><text x="60" y="50" font-size="11" fill="#5A3A00">deshacer</text></g>
    </g>
    <!-- fila Q: octava alta -->
    <g transform="translate(40,215)">
      <g transform="translate(0,0)"><rect width="90" height="60" rx="12" fill="#fff"/><text x="45" y="32" font-size="18" fill="#5A3A00">Tab</text><text x="45" y="50" font-size="11" fill="#5A3A00">samples</text></g>
      <g transform="translate(100,0)"><rect width="60" height="60" rx="12" fill="#FF3B3B" opacity="0.6"/><text x="30" y="38" fill="#fff">Q</text></g>
      <g transform="translate(170,0)"><rect width="60" height="60" rx="12" fill="#FF8A00" opacity="0.6"/><text x="30" y="38" fill="#fff">W</text></g>
      <g transform="translate(240,0)"><rect width="60" height="60" rx="12" fill="#FFD400" opacity="0.6"/><text x="30" y="38" fill="#5A3A00">E</text></g>
      <g transform="translate(310,0)"><rect width="60" height="60" rx="12" fill="#2ED573" opacity="0.6"/><text x="30" y="38" fill="#fff">R</text></g>
      <g transform="translate(380,0)"><rect width="60" height="60" rx="12" fill="#1EC8FF" opacity="0.6"/><text x="30" y="38" fill="#fff">T</text></g>
      <g transform="translate(450,0)"><rect width="60" height="60" rx="12" fill="#3D7BFF" opacity="0.6"/><text x="30" y="38" fill="#fff">Y</text></g>
      <g transform="translate(520,0)"><rect width="60" height="60" rx="12" fill="#B45CFF" opacity="0.6"/><text x="30" y="38" fill="#fff">U</text></g>
      <text x="600" y="38" text-anchor="start" font-size="16" fill="#5A3A00">← acordes una octava más agudos</text>
    </g>
    <!-- fila A: acordes -->
    <g transform="translate(40,285)">
      <g transform="translate(115,0)"><rect width="60" height="60" rx="12" fill="#FF3B3B"/><text x="30" y="32" fill="#fff">A</text><text x="30" y="50" font-size="12" fill="#fff">I</text></g>
      <g transform="translate(185,0)"><rect width="60" height="60" rx="12" fill="#FF8A00"/><text x="30" y="32" fill="#fff">S</text><text x="30" y="50" font-size="12" fill="#fff">ii</text></g>
      <g transform="translate(255,0)"><rect width="60" height="60" rx="12" fill="#FFD400"/><text x="30" y="32" fill="#5A3A00">D</text><text x="30" y="50" font-size="12" fill="#5A3A00">iii</text></g>
      <g transform="translate(325,0)"><rect width="60" height="60" rx="12" fill="#2ED573"/><text x="30" y="32" fill="#fff">F</text><text x="30" y="50" font-size="12" fill="#fff">IV</text></g>
      <g transform="translate(395,0)"><rect width="60" height="60" rx="12" fill="#1EC8FF"/><text x="30" y="32" fill="#fff">G</text><text x="30" y="50" font-size="12" fill="#fff">V</text></g>
      <g transform="translate(465,0)"><rect width="60" height="60" rx="12" fill="#3D7BFF"/><text x="30" y="32" fill="#fff">H</text><text x="30" y="50" font-size="12" fill="#fff">vi</text></g>
      <g transform="translate(535,0)"><rect width="60" height="60" rx="12" fill="#B45CFF"/><text x="30" y="32" fill="#fff">J</text><text x="30" y="50" font-size="12" fill="#fff">vii</text></g>
      <text x="615" y="38" text-anchor="start" font-size="16" fill="#5A3A00">← ACORDES (o batería)</text>
      <g transform="translate(830,0)"><rect width="120" height="130" rx="12" fill="#fff"/><text x="60" y="62" font-size="18" fill="#5A3A00">Intro</text><text x="60" y="84" font-size="12" fill="#5A3A00">play / pausa</text></g>
    </g>
    <!-- fila Z: menús -->
    <g transform="translate(40,355)">
      <g transform="translate(150,0)"><rect width="60" height="60" rx="30" fill="#8E8A99"/><text x="30" y="32" fill="#fff">Z</text><text x="30" y="50" font-size="11" fill="#fff">tono</text></g>
      <g transform="translate(220,0)"><rect width="60" height="60" rx="30" fill="#FFE600" stroke="#D9A600" stroke-width="3"/><text x="30" y="32" fill="#5A3A00">X</text><text x="30" y="50" font-size="11" fill="#5A3A00">sonido</text></g>
      <g transform="translate(290,0)"><rect width="60" height="60" rx="30" fill="#FF3B30"/><text x="30" y="32" fill="#fff">C</text><text x="30" y="50" font-size="11" fill="#fff">modo</text></g>
      <g transform="translate(430,0)"><rect width="60" height="60" rx="12" fill="#fff"/><text x="30" y="32" fill="#5A3A00">B</text><text x="30" y="50" font-size="11" fill="#5A3A00">tap</text></g>
    </g>
    <!-- espacio -->
    <g transform="translate(260,425)">
      <rect x="-20" width="400" height="60" rx="14" fill="#FF7A1A"/>
      <text x="180" y="30" fill="#fff">ESPACIO</text>
      <text x="180" y="50" font-size="13" fill="#fff">click del joystick · grabar · confirmar · (con Z/X/C: aleatorio)</text>
    </g>
    <!-- flechas -->
    <g transform="translate(700,415)">
      <g transform="translate(70,-70)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="40" fill="#FFE45C">↑</text></g>
      <g transform="translate(0,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="40" fill="#FFE45C">←</text></g>
      <g transform="translate(70,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="40" fill="#FFE45C">↓</text></g>
      <g transform="translate(140,0)"><rect width="60" height="60" rx="12" fill="#1C1230"/><text x="30" y="40" fill="#FFE45C">→</text></g>
      <text x="100" y="82" font-size="14" fill="#5A3A00">JOYSTICK (2 a la vez = diagonal)</text>
    </g>
  </g>

  <!-- perilla -->
  <g transform="translate(1100,150)" font-weight="700" text-anchor="middle">
    <circle r="56" fill="#1C1230"/>
    <circle r="44" fill="#FF7A1A"/>
    <rect x="-4" y="-40" width="8" height="22" rx="4" fill="#fff"/>
    <path d="M -66 -30 A 72 72 0 0 1 66 -30" fill="none" stroke="#5A3A00" stroke-width="4"/>
    <text y="84" font-size="18" fill="#5A3A00">PERILLA</text>
    <g font-size="13" fill="#5A3A00">
      <text y="106">sola: volumen</text>
      <text y="124" fill="#5f5b6b">+Z: attack</text>
      <text y="142" fill="#8a6a00">+X: release</text>
      <text y="160" fill="#B3221A">+C: filtro / tempo</text>
      <text y="178">pulsar: mute</text>
    </g>
  </g>
</svg>
