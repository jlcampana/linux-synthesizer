<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Fredoka, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif">
  <title>Chispa – mis canciones: guardar y exportar</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#FF7A1A"/>
  <rect x="12" y="12" width="936" height="516" rx="36" fill="url(#body)"/>

  <rect x="36" y="30" width="290" height="48" rx="24" fill="#1EC8FF"/>
  <text x="181" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">♫ MIS CANCIONES</text>
  <rect x="340" y="34" width="190" height="40" rx="20" fill="#2ED573"/>
  <text x="435" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">✓ guardado hace 3 s</text>
  <text x="924" y="62" text-anchor="end" font-size="18" font-weight="700" fill="#5A3A00">flechas elegir · Espacio abrir · F5 salir</text>

  <!-- tarjetas de canciones -->
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(36,98)">
      <rect x="-6" y="-6" width="232" height="220" rx="32" fill="none" stroke="#fff" stroke-width="6"/>
      <rect width="220" height="208" rx="28" fill="#FF8A00"/>
      <!-- dragón sencillo -->
      <g transform="translate(110,80)">
        <ellipse rx="52" ry="38" fill="#FFD400"/>
        <path d="M-10 -36 l10 -22 l10 22 z M20 -32 l12 -18 l4 22 z" fill="#FF3B30"/>
        <circle cx="-18" cy="-8" r="8" fill="#1C1230"/><circle cx="18" cy="-8" r="8" fill="#1C1230"/>
        <path d="M-16 14 q16 14 32 0" fill="none" stroke="#1C1230" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="110" y="160" font-size="24" fill="#fff">Dragón Naranja</text>
      <text x="110" y="186" font-size="15" fill="#fff" opacity="0.9">Do mayor · 120 · 3 pistas</text>
    </g>
    <g transform="translate(270,98)">
      <rect width="220" height="208" rx="28" fill="#B45CFF"/>
      <g transform="translate(110,80)">
        <circle r="40" fill="#FF5CD6"/>
        <path d="M-40 10 q-14 30 -2 40 M-20 30 q-6 26 6 32 M0 38 q0 26 12 28 M20 30 q8 24 22 22 M40 10 q16 26 4 40" fill="none" stroke="#FF5CD6" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-14" cy="-6" r="7" fill="#1C1230"/><circle cx="14" cy="-6" r="7" fill="#1C1230"/>
      </g>
      <text x="110" y="160" font-size="24" fill="#fff">Pulpo Saltarín</text>
      <text x="110" y="186" font-size="15" fill="#fff" opacity="0.9">La menor · 90 · 5 pistas</text>
    </g>
    <g transform="translate(504,98)">
      <rect width="220" height="208" rx="28" fill="#2ED573"/>
      <g transform="translate(110,80)">
        <path d="M0 -44 L12 -12 L46 -12 L18 8 L28 42 L0 22 L-28 42 L-18 8 L-46 -12 L-12 -12 Z" fill="#FFE600"/>
      </g>
      <text x="110" y="160" font-size="24" fill="#fff">Estrella Loca</text>
      <text x="110" y="186" font-size="15" fill="#fff" opacity="0.9">Sol blues · 140 · 2 pistas</text>
    </g>
    <g transform="translate(738,98)">
      <rect width="186" height="208" rx="28" fill="none" stroke="#FF7A1A" stroke-width="6" stroke-dasharray="14 10"/>
      <circle cx="93" cy="80" r="38" fill="#FF7A1A"/>
      <path d="M93 60 v40 M73 80 h40" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <text x="93" y="160" font-size="24" fill="#FF7A1A">Nueva</text>
    </g>
  </g>

  <!-- panel exportar -->
  <rect x="36" y="330" width="888" height="180" rx="26" fill="#1C1230" stroke="#FF7A1A" stroke-width="8"/>
  <text x="66" y="370" font-size="22" font-weight="700" fill="#4DF0FF">Enviar "Dragón Naranja" a la familia:</text>
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(66,390)">
      <rect width="190" height="90" rx="22" fill="#FF3B30"/>
      <text x="95" y="48" font-size="34" fill="#fff">MP3</text><text x="95" y="74" font-size="15" fill="#fff">para el móvil</text>
    </g>
    <g transform="translate(276,390)">
      <rect x="-5" y="-5" width="200" height="100" rx="26" fill="none" stroke="#FFE45C" stroke-width="5"/>
      <rect width="190" height="90" rx="22" fill="#FF8A00"/>
      <text x="95" y="48" font-size="34" fill="#fff">OGG</text><text x="95" y="74" font-size="15" fill="#fff">libre y ligero</text>
    </g>
    <g transform="translate(486,390)">
      <rect width="190" height="90" rx="22" fill="#3D7BFF"/>
      <text x="95" y="48" font-size="34" fill="#fff">WAV</text><text x="95" y="74" font-size="15" fill="#fff">máxima calidad</text>
    </g>
  </g>
  <!-- progreso -->
  <g transform="translate(700,394)" font-weight="700">
    <text x="0" y="20" font-size="17" fill="#FFE45C">Creando OGG…</text>
    <rect x="0" y="34" width="200" height="26" rx="13" fill="#3d2c66"/>
    <rect x="0" y="34" width="136" height="26" rx="13" fill="#FFE45C"/>
    <text x="0" y="84" font-size="13" fill="#8a7bb0">~/Música/Chispa/Exportadas/</text>
  </g>
</svg>
